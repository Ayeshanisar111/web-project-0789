<h1>Contact Fitnest</h1>
<div class="contact-wrapper">
  <div class="about">
    <h2>About Fitnest - Lahore</h2>
    <p>Fitnest is your urban fitness haven. Open 6am to 11pm, Johar Town.</p>
    <button id="themeBtn">Toggle Dark Mode</button>
    <p id="moreText" style="display:none;">We have 50+ certified trainers and diet plans.</p>
    <button id="showBtn">Show More / Hide</button>
  </div>
  <form class="contact-form">
    <input type="text" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <span id="emailMsg"></span>
    <textarea rows="4" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>
<script src="contact.js"></script>
</body>
